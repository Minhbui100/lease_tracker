<!DOCTYPE html>
<html>
<head><title>Dashboard</title></head>
<body>
    <h2>Dashboard</h2>

    <div style="display:flex; gap:20px;">
        <div style="border:1px solid #ccc; padding:15px; text-align:center;">
            <h3>{{active_leases}}</h3>
            <p>Active Leases</p>
            <a href="{{url_for('leases.list_leases')}}">View all</a>
        </div>

        <div style="border:1px solid #ccc; padding:15px; text-align:center;">
            <h3>{{late_payments}}</h3>
            <p>Late Payments</p>
            <a href="{{url_for('payments.list_payments')}}">View all</a>
        </div>

        <div style="border:1px solid #ccc; padding:15px; text-align:center;">
            <h3>{{pending_payments}}</h3>
            <p>Pending Payments</p>
            <a href="{{url_for('payments.list_payments')}}">View all</a>
        </div>

        <div style="border:1px solid #ccc; padding:15px; text-align:center;">
            <h3>{{open_tickets}}</h3>
            <p>Open Maintenance Tickets</p>
            <a href="{{url_for('maintenance.list_requests')}}">View all</a>
        </div>
    </div>
</body>
</html>
