<!DOCTYPE html>
<html>
    <head><title>{{"Edit" if lease else "Add"}} Lease</title></head>
    <body>
        <h2>{{"Edit" if lease else "Add"}} Lease</h2>

        <form method="POST">
            <label>Property:
                <select name="property_id" required {%if lease%}disabled{%endif%}>
                    {%for p in properties%}
                        <option value="{{p.id}}" {%if lease and lease.property_id==p.id%}selected{%endif%}>
                            {{p.address}} {{p.city}}
                        </option>
                    {%endfor%}
                </select>
                {%if lease%}
                <input type="hidden" name="property_id" value="{{lease.property_id}}">
                {%endif%}
            </label><br>
            <label>Tenants (Select one or more):<br>
                <select name="tenant_ids" multiple size="5">
                    {%for tenant in tenants%}
                        <option value="{{tenant.id}}" {%if lease and tenant in lease.tenants%}selected{%endif%}>
                            {{tenant.first_name}} {{tenant.last_name}}
                        </option>
                    {%endfor%}
                </select>
            </label><br>
            <label>Start Date: <input type="date" name="start_date" value="{{lease.start_date if lease else ''}}" required></label><br>
            <label>End Date: <input type="date" name="end_date" value="{{lease.end_date if lease else ''}}" required></label><br>
            <label>Rent: <input type="number" step="0.01" name="monthly_rent" value="{{lease.monthly_rent if lease else ''}}" required></label><br>
            <label>Rent Due Date (1-28): <input type="number" min="1" max="28" name="rent_due_date" value="{{lease.rent_due_date if lease else ''}}" required></label><br>
            <label>Refundable Deposit: <input type="number" step="0.01" name="refundable_deposit" value="{{lease.refundable_deposit if lease else 0}}"></label><br>
            <label>Non-refundable Deposit: <input type="number" step="0.01" name="nonrefundable_deposit" value="{{lease.nonrefundable_deposit if lease else 0}}"></label><br>
            <label>Cars: <input type="number" name="cars" value="{{lease.cars if lease else 0}}"></label><br>
            <label>Pets: <input type="number" name="pets" value="{{lease.pets if lease else 0}}"></label><br>
            
            {%if lease%}
            <label>Status:
                <select name="status">
                    <option value="active" {%if lease.status=='active'%}selected{%endif%}>Active</option>
                    <option value="expired" {%if lease.status=='expired'%}selected{%endif%}>Expired</option>
                    <option value="terminated" {%if lease.status=='terminated'%}selected{%endif%}>Terminated</option>
                </select>
            </label><br>
            {%endif%}
            <button type="submit">Save</button>
        </form>
        <a href="{{url_for('leases.list_leases')}}">Back to lease list</a>
    </body>
</html>
